<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJK Glyph Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="base-fonts" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+HK:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="title-row">
    <h1>CJK Glyph Comparison</h1>
    <button id="theme-toggle" title="Toggle light/dark mode"></button>
  </div>
  <div class="input-row">
    <input id="glyph-input" type="text" placeholder="Type characters to compare..." autofocus>
    <button id="copy-btn" title="Copy link">Copy Link</button>
  </div>
  <div class="presets" id="preset-bar"></div>
</div>

<div class="grid" id="grid"></div>

<footer>
  This tool shows how different CJK font families render the same characters.
  It does not determine which glyph form is "correct" for a specific region.
  <br>
  Source code on 
  <a href="https://github.com/My2ndAngelic/HanGlyphComparison" target="_blank" rel="noopener noreferrer">
    GitHub
  </a>
  by My2ndAngelic.
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
